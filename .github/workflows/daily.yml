name: daily-etl

on:
  schedule:
    - cron: "23 6 * * *"      # every day 06:23 UTC
  workflow_dispatch:
  pull_request:
    paths: ["pipeline/**", "sql/**", "tests/**", "requirements.txt", ".github/workflows/daily.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", "sql/**", "tests/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: tech-job-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobs
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Lint
        run: pip install ruff && ruff check .
      - name: Unit + integration tests
        run: pytest -q
      - name: Extract, transform, load
        if: github.event_name != 'pull_request'
        run: python -m pipeline.run
      - name: Commit reports and history
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "etl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily report $(date -u +%F)"
          git push
